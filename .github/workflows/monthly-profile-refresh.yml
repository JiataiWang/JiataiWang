name: Monthly profile refresh

on:
  schedule:
    - cron: "17 1 1 * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Test the scoped profile updater
        run: python3 -m unittest discover -s tests -p "test_update_profile_contributions.py"

      - name: Refresh merged contributions and linked Star counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_contributions.py

      - name: Commit the profile update to main
        shell: bash
        run: |
          while IFS= read -r status_line; do
            changed_file="${status_line:3}"
            case "${changed_file}" in
              README.md)
                ;;
              *)
                echo "::error::The updater changed a file outside its allowed scope: ${changed_file}"
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)

          git add README.md
          if git diff --cached --quiet; then
            echo "No profile data changed; nothing to update."
            exit 0
          fi

          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile data"
          git push origin HEAD:main
