name: Monthly profile refresh

on:
  schedule:
    - cron: "17 1 1 * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Test the scoped README updater
        run: python3 -m unittest discover -s tests -p "test_update_profile_contributions.py"

      - name: Refresh merged contribution tables
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_contributions.py

      - name: Commit the profile update to main
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No newly merged external PRs; nothing to update."
            exit 0
          fi

          git diff --check

          changed_files="$(git diff --name-only)"
          if [[ "${changed_files}" != "README.md" ]]; then
            echo "::error::The updater changed files outside README.md:"
            echo "${changed_files}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh merged profile contributions"
          git push origin HEAD:main
